<text x="560" y="928" text-anchor="start" font-size="20" font-weight="bold">BUILD NOTES</text>
<text x="560" y="956" text-anchor="start" font-size="17">• Sensor TX goes to GPIO 17, the pin the ESP32 receives on. Wired straight through, neither end listens.</text>
<text x="560" y="980" text-anchor="start" font-size="17">• MFRC522 is 3.3 V only; 5 V destroys a bare AS608. Both modules share the single 3V3 pin.</text>
<text x="560" y="1004" text-anchor="start" font-size="17">• Fit 100 µF and 100 nF across 3V3 and GND at each module.</text>
<text x="1360" y="1048" text-anchor="end" font-size="16">Pin assignments from firmware/L_SIAMS_Bench/L_SIAMS_Bench.ino</text>
